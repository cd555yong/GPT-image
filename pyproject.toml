[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-image-generator-desktop"
version = "4.0.0"
description = "Windows desktop app for OpenAI-compatible image generation and editing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.28",
    "httpx>=0.24",
    "Pillow>=9.0",
    "tkinterdnd2>=0.3",
]
keywords = ["openai", "image-generation", "desktop", "tkinter", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]

[project.gui-scripts]
gpt-image-generator = "gpt_image_app:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[tool.setuptools]
py-modules = ["gpt_image_app"]
